[project]
name = "meta-search"
license = "GPL-3.0-only"
version = "0.1.0"
description = "Dynamic objective, review-evidence, and sales catalog MCP"
requires-python = ">=3.11"
dependencies = ["mcp>=1.12,<2", "pydantic>=2", "jsonschema>=4", "pyyaml>=6", "filelock>=3.16"]
[project.scripts]
meta-search = "meta_search.server:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/meta_search"]
