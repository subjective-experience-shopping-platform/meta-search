[project]
license = "GPL-3.0-only"
name = "meta-search"
version = "0.1.0"
description = "Dynamic objective, review-evidence, and sales catalog MCP"
requires-python = ">=3.11"
dependencies = ["mcp>=1.12,<2", "pydantic>=2", "jsonschema>=4", "pyyaml>=6", "filelock>=3.16"]
[project.scripts]
meta-search = "meta_search.server:main"
[dependency-groups]
dev = ["pytest>=8", "ruff>=0.14"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/meta_search"]
[tool.hatch.build.targets.sdist]
include = ["src", "prompts", "schemas", "scripts", "tests", "config.toml", "pyproject.toml", "uv.lock", "README.md", "LICENSE", "IMPLEMENTATION_PLAN.md", "VERIFICATION.md", "AGENTS.md", "bootstrap_exact_matches.json"]
exclude = ["cloud/**", "models/**"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
